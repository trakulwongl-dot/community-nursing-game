<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>กระดานอันดับ · ผจญภัยหมู่บ้านสุขใจ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600&family=Prompt:wght@400;500;600&display=swap">
<style>
:root{--ink:#23323b;--paper:#fffaf0;--soft:#f3ead3;--sun:#f6b73c;--leaf:#3f9b5a;--sea:#2d8fb8;--rose:#d9483d;--gold:#f2b705;--silver:#aab4be;--bronze:#c9803f;--fd:'Kanit','Prompt',sans-serif;--fb:'Prompt','Tahoma',sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:var(--fb);color:var(--ink);background:linear-gradient(#bfe6f5,#e8f5d8 60%,#cfe8a8);padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 40px max(14px,env(safe-area-inset-left))}
.wrap{max-width:760px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
h1{font-family:var(--fd);font-weight:600;font-size:clamp(22px,5vw,32px);margin:0;line-height:1.2}
.sub{font-size:14px;opacity:.75;margin-top:2px}
.btn{font:600 14px var(--fb);padding:8px 14px;border:2.5px solid var(--ink);border-radius:14px;background:var(--sun);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--ink);text-decoration:none;display:inline-block}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.card{background:var(--paper);border:2.5px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:14px;margin-bottom:16px}
h2{font-family:var(--fd);font-weight:600;font-size:18px;margin:0 0 10px}
.crowns{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cw{border:2px solid var(--ink);border-radius:16px;padding:10px;text-align:center;background:#fff;cursor:pointer;font:inherit;color:inherit}
.cw svg{width:44px;height:36px}.cw b{display:block;font-family:var(--fd);font-weight:600;font-size:14px;margin-top:2px}
.cw .who{font-size:15px;font-weight:600;margin-top:4px;overflow-wrap:anywhere}.cw .v{font-size:12.5px;opacity:.7}
.pod{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin-bottom:6px}
.pd{border:2.5px solid var(--ink);border-radius:18px 18px 8px 8px;text-align:center;padding:10px 6px 8px;background:#fff;cursor:pointer;font:inherit;color:inherit;min-width:0}
.pd.r1{background:#fff3c4;padding-top:16px}.pd.r2{background:#eef2f5}.pd.r3{background:#f7e3cf}
.pd svg{width:40px;height:32px}.pd .n{font-weight:600;font-size:15px;overflow-wrap:anywhere;margin-top:2px}.pd .s{font-family:var(--fd);font-weight:600;font-size:20px}
.av{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:2.5px solid var(--ink);font-family:var(--fd);font-weight:600;font-size:20px;color:#fff}
table{width:100%;border-collapse:collapse}th{font-size:12.5px;text-align:left;opacity:.65;padding:4px 6px}td{padding:8px 6px;border-top:1.5px dashed #e6d9bd;font-size:15px}
tr.row{cursor:pointer}tr.row:hover{background:#fbf3dc}td.rk{width:36px;font-family:var(--fd);font-weight:600}td.sc{font-weight:600;text-align:right}
td svg{width:20px;height:16px;vertical-align:-2px;margin-right:2px}
.empty{padding:26px;text-align:center;opacity:.7}
#pop{position:fixed;inset:0;background:rgba(35,50,59,.45);display:none;place-items:center;padding:16px;z-index:10}
#pop.on{display:grid}
.pc{width:min(340px,100%);background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:18px;text-align:center;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(14px) scale(.96);opacity:0}}
.pc .av{width:64px;height:64px;font-size:28px}.pc h3{font-family:var(--fd);font-weight:600;font-size:21px;margin:8px 0 2px;overflow-wrap:anywhere}
.ttl{display:inline-block;font-size:13px;font-weight:600;background:var(--ink);color:var(--paper);border-radius:10px;padding:2px 12px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}.st div{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:6px 2px}
.st b{display:block;font-family:var(--fd);font-weight:600;font-size:19px}.st span{font-size:12px;opacity:.7}
.mine{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px}.mine span{font-size:13px;border:2px solid var(--ink);border-radius:999px;padding:2px 10px 2px 6px;background:#fff;display:inline-flex;align-items:center;gap:4px}
.mine svg{width:20px;height:16px}
#msg{font-size:13px;opacity:.7;text-align:center;margin-top:6px}
@media(max-width:420px){td{font-size:14px}.pd .s{font-size:17px}}
</style></head><body><div class="wrap">
<header><div><h1>กระดานอันดับ</h1><div class="sub" id="sub">กำลังโหลด...</div></div><div><button class="btn" id="rf">รีเฟรช</button> <a class="btn" href="index.html" style="background:#fff">กลับไปเล่น</a></div></header>
<section class="card"><h2>ห้องมงกุฎ ใครได้มงกุฎไหน</h2><div class="crowns" id="crowns"></div></section>
<section class="card"><h2>ตารางอันดับ</h2><div class="pod" id="pod"></div><div id="tbl"></div></section>
<div id="msg"></div></div>
<div id="pop"><div class="pc" id="pc"></div></div>
<script>
"use strict";
const SHEET_URL="https://script.google.com/macros/s/AKfycbx6PC4sfC9m2FEYOionsVGpvt1dclejuPBhh8SOtYy5YIbsthC41O-lohVUwIMjYwGA6g/exec";
const STEAL_CAP=.4;
const $=id=>document.getElementById(id),esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COL={g:"#f2b705",s:"#aab4be",b:"#c9803f",x:"#2d8fb8",p:"#d9483d",l:"#3f9b5a"};
const crown=(c,w)=>`<svg viewBox="0 0 44 36" ${w?`width="${w}"`:""} aria-hidden="true"><path d="M5 30 L2 10 L13 19 L22 4 L31 19 L42 10 L39 30 Z" fill="${c}" stroke="#23323b" stroke-width="2.5" stroke-linejoin="round"/><rect x="5" y="30" width="34" height="4" rx="1.5" fill="${c}" stroke="#23323b" stroke-width="2.5"/><circle cx="22" cy="22" r="2.6" fill="#fff" stroke="#23323b" stroke-width="1.5"/></svg>`;
const AVC=["#3f9b5a","#2d8fb8","#d9483d","#8a6bd1","#e0883a","#2a9d8f","#c95a8a"];
const avc=id=>{let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))>>>0;return AVC[h%AVC.length]};
let rows=[],season="0";
function calc(list){
  const loss={};list.forEach(q=>{for(const k in(q.drains||{}))loss[k]=(loss[k]||0)+(q.drains[k].pts||0)});
  list.forEach(p=>{let g=0;for(const k in(p.drains||{}))g+=p.drains[k].pts||0;p.gain=g;
    const l=Math.min(loss[p.id]||0,Math.floor(STEAL_CAP*(p.score||0)));p.net=Math.max(0,Math.round((p.score||0)+g-l-(p.pen||0)));
    p.starN=(p.stars||[]).reduce((a,b)=>a+b,0);p.lv=p.lv||0});
  return list}
function crownsOf(){
  const out=[];if(!rows.length)return out;
  const best=(f,min)=>{let b=null;rows.forEach(r=>{const v=f(r);if(v>=min&&(!b||v>b.v||(v===b.v&&r.net>b.r.net)))b={r,v}});return b};
  const a=best(r=>r.net,1);if(a)out.push({k:"net",name:"มงกุฎทอง",desc:"แต้มรวมสูงสุด",c:COL.g,...a,val:a.v+" แต้ม"});
  const s=best(r=>r.starN,1);if(s)out.push({k:"star",name:"มงกุฎนักสะสมดาว",desc:"ดาวมากที่สุด",c:COL.x,...s,val:s.v+"/12 ดาว"});
  const d=best(r=>r.gain,1);if(d)out.push({k:"duel",name:"มงกุฎเจ้ายุทธจักร",desc:"สูบแต้มจากการดวลได้มากสุด",c:COL.p,...d,val:"+"+d.v+" แต้ม"});
  const f=best(r=>r.lv,4);if(f)out.push({k:"fin",name:"มงกุฎผู้พิชิตหมู่บ้าน",desc:"ผ่านครบทั้ง 4 ด่าน",c:COL.l,...f,val:rows.filter(r=>r.lv>=4).length+" คนผ่านครบ"});
  return out}
function myCrowns(id){const c=[];crownsOf().forEach(x=>{if(x.r.id===id)c.push(x)});
  const i=rows.findIndex(r=>r.id===id);if(i===1)c.push({name:"มงกุฎเงิน",c:COL.s});if(i===2)c.push({name:"มงกุฎทองแดง",c:COL.b});return c}
const rankCol=i=>i===0?COL.g:i===1?COL.s:i===2?COL.b:null;
function title(i,r){return i===0?"แชมป์ชุมชน":i===1?"รองแชมป์":i===2?"อันดับสาม":r.lv>=4?"ผู้พิชิตหมู่บ้าน":r.lv>0?"พยาบาลชุมชนฝึกหัด":"นักสำรวจหน้าใหม่"}
function render(){
  rows.sort((a,b)=>b.net-a.net);
  $("sub").textContent=rows.length?`ผู้เล่น ${rows.length} คน · อัปเดตอัตโนมัติทุก 10 วินาที`:"ยังไม่มีผู้เล่น";
  $("crowns").innerHTML=crownsOf().map(x=>`<button class="cw" data-id="${esc(x.r.id)}">${crown(x.c)}<b>${x.name}</b><div class="v">${x.desc}</div><div class="who">${esc(x.r.name||"-")}</div><div class="v">${x.val}</div></button>`).join("")||'<div class="empty">ยังไม่มีมงกุฎ เริ่มเล่นเพื่อชิงมงกุฎได้เลย</div>';
  const top=rows.slice(0,3),order=[1,0,2].filter(i=>top[i]);
  $("pod").innerHTML=order.map(i=>`<button class="pd r${i+1}" data-id="${esc(top[i].id)}">${crown(rankCol(i))}<div class="n">${esc(top[i].name||"-")}</div><div class="s">${top[i].net}</div><div style="font-size:12px;opacity:.7">อันดับ ${i+1}</div></button>`).join("");
  $("tbl").innerHTML=rows.length?`<table><tr><th>#</th><th>ชื่อ</th><th>ดาว</th><th style="text-align:right">แต้ม</th></tr>`+rows.slice(0,100).map((r,i)=>`<tr class="row" data-id="${esc(r.id)}"><td class="rk">${i+1}</td><td>${rankCol(i)?crown(rankCol(i)):""}${esc(r.name||"-")}</td><td>${r.starN}/12</td><td class="sc">${r.net}</td></tr>`).join("")+"</table>":'<div class="empty">ยังไม่มีผู้เล่น</div>'}
function openPop(id){
  const i=rows.findIndex(r=>r.id===id);if(i<0)return;const r=rows[i],cs=myCrowns(id);
  $("pc").innerHTML=`<div class="av" style="background:${avc(r.id)}">${esc((r.name||"?").trim().charAt(0)||"?")}</div><h3>${esc(r.name||"-")}</h3><span class="ttl">${title(i,r)}</span>
  <div class="st"><div><b>${i+1}</b><span>อันดับ</span></div><div><b>${r.net}</b><span>แต้ม</span></div><div><b>${r.starN}/12</b><span>ดาว</span></div></div>
  <div style="font-size:13px;opacity:.75;margin-bottom:8px">ไปถึงด่าน ${Math.min(4,r.lv)}/4${r.gain?` · สูบแต้มจากดวล +${r.gain}`:""}</div>
  <div class="mine">${cs.length?cs.map(c=>`<span>${crown(c.c)}${c.name}</span>`).join(""):'<span style="border-style:dashed;opacity:.7">ยังไม่มีมงกุฎ</span>'}</div>
  <button class="btn" id="cl">ปิด</button>`;
  $("pop").classList.add("on");$("cl").onclick=()=>$("pop").classList.remove("on")}
document.addEventListener("click",e=>{const t=e.target.closest("[data-id]");if(t)openPop(t.dataset.id);else if(e.target===$("pop"))$("pop").classList.remove("on")});
async function load(){
  if(!SHEET_URL){$("msg").textContent="ยังไม่ได้ตั้งค่าลิงก์ Google Sheets";return}
  try{const j=await(await fetch(SHEET_URL,{redirect:"follow"})).json();if(!j.ok)throw 0;season=String(j.season||"0");
    rows=calc((j.players||[]).filter(r=>String(r.season||"0")===season));$("msg").textContent="";render()}
  catch(e){$("msg").textContent="โหลดข้อมูลไม่ได้ ลองรีเฟรชอีกครั้ง"}}
$("rf").onclick=load;load();setInterval(load,10000);
</script></body></html>
