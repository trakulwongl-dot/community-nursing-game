<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>แผนที่เส้นทาง · การพยาบาลชุมชน 2</title>
<style>
:root{--bg:#eaf4e2;--surface:#fffaf0;--soft:#f3ead3;--ink:#23323b;--muted:#5b6b73;--leaf:#3f9b5a;--leaf2:#8cc87f;--sun:#f6b73c;--rose:#d9483d;--sea:#2d8fb8;--line:#23323b;--path:#c9b98f;--ground:#d6ecc4;--roof:#d9483d;--fd:'Kanit','Prompt',sans-serif;--fb:'Prompt','Tahoma',sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16211c;--surface:#1f2e27;--soft:#2a3b33;--ink:#eef3ea;--muted:#a9b9b0;--leaf:#6cc487;--leaf2:#3f7a52;--sun:#f3bd55;--rose:#ef7a6f;--sea:#6bb8dc;--line:#eef3ea;--path:#6f8577;--ground:#22362b;--roof:#ef7a6f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.6;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:18px}
h1,h2,h3{font-family:var(--fd);font-weight:600;line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:clamp(26px,6vw,34px)}h2{font-size:20px}h3{font-size:18px}
p{margin:0}.tag{font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--sea)}
.note{font-size:14.5px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-block;font:600 15px var(--fb);color:#23323b;background:var(--sun);border:2.5px solid var(--line);border-radius:14px;padding:8px 16px;text-decoration:none;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}.btn.alt{background:var(--surface);color:var(--ink)}
input[type=text],input[inputmode]{font:500 16px var(--fb);padding:9px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:#23323b;min-width:0;flex:1 1 160px}
.card{background:var(--surface);border:2.5px solid var(--line);border-radius:20px;box-shadow:0 5px 0 var(--line);padding:16px;display:grid;gap:10px}
.msg{font-size:14px;font-weight:600}.msg.err{color:var(--rose)}
.mapbox{background:var(--ground);border:2.5px solid var(--line);border-radius:22px;box-shadow:0 5px 0 var(--line);padding:6px;overflow:hidden}
svg{display:block;width:100%;height:auto}
.node{cursor:pointer}.node:focus{outline:none}.node:focus-visible .ring{stroke:var(--sea);stroke-width:5}
.lbl{font-family:var(--fb);font-size:13px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--ground);stroke-width:4px;stroke-linejoin:round}
.lbl2{font-family:var(--fb);font-size:10.5px;font-weight:500;fill:var(--muted);paint-order:stroke;stroke:var(--ground);stroke-width:4px;stroke-linejoin:round}
.num{font-family:var(--fd);font-size:15px;font-weight:600;text-anchor:middle}
.you{font-family:var(--fd);font-size:11px;font-weight:600;fill:#fff;text-anchor:middle}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);padding:2px 4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--line);vertical-align:-1px;margin-right:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:12.5px;font-weight:600;border:2px solid var(--line);border-radius:999px;padding:0 10px;background:var(--soft)}
.chip.live{background:var(--sun);color:#23323b}.chip.done{background:var(--leaf);color:#fff;border-color:var(--leaf)}.chip.lock{border-style:dashed;background:transparent;color:var(--muted)}.chip.team{background:var(--sea);color:#fff;border-color:var(--sea)}
table{width:100%;border-collapse:collapse;font-size:14.5px}td{padding:5px 4px;border-bottom:1.5px dashed var(--path)}td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bar{height:10px;border:2px solid var(--line);border-radius:8px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--leaf)}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pl 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pl{from{transform:scale(1);opacity:.7}to{transform:scale(1.9);opacity:0}}}
.slot{border:2.5px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:0 4px 0 var(--line);padding:12px;display:grid;gap:8px}
.slot h3{font-size:16px;display:flex;justify-content:space-between;gap:8px}
.f{display:grid;gap:4px}.f>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.fld{min-height:44px;border:2.5px dashed var(--path);border-radius:12px;padding:6px 8px;background:transparent;color:var(--ink);font:500 14.5px var(--fb);text-align:left;width:100%;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fld.on{border-style:solid;border-color:var(--sea);box-shadow:0 0 0 3px color-mix(in srgb,var(--sea) 30%,transparent)}
.fld .ph{color:var(--muted);font-size:14px}
.chipx{display:inline-flex;gap:6px;align-items:flex-start;border:2px solid var(--line);border-radius:10px;padding:2px 8px;font-size:13.5px;line-height:1.4;color:#23323b}
.chipx b{cursor:pointer;font-weight:700;padding:0 2px}
.t-pop{background:#cfe8ff}.t-prob{background:#ffd9d4}.t-cause{background:#fff0b8}.t-ev{background:#d7f0d0}
.pool{display:grid;gap:8px}
.pc{font:500 14.5px/1.45 var(--fb);text-align:left;border:2.5px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer;color:#23323b;box-shadow:0 3px 0 var(--line)}
.pc:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.pc.used{opacity:.45;box-shadow:none}
.ok{color:var(--leaf);font-weight:700}.bad{color:var(--rose);font-weight:700}
.stars{font-size:26px;letter-spacing:4px}
.sticky{position:sticky;bottom:0;background:var(--bg);padding:10px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:5}

.qc{display:grid;gap:10px}.qn{font:600 13px var(--fb);color:var(--sea)}
.qt{font-size:16px;line-height:1.6}
.opt{display:flex;gap:10px;align-items:flex-start;border:2.5px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--soft);cursor:pointer;font-size:15px}
.opt input{margin-top:5px;width:18px;height:18px;flex:none;accent-color:var(--leaf)}
.opt:has(input:checked){background:var(--sun);color:#23323b}
select{font:500 15px var(--fb);padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:#fff;color:#23323b;max-width:100%}
.mrow{display:grid;gap:4px;padding:8px 0;border-bottom:1.5px dashed var(--path)}
.fb{font-size:14px;padding:8px 10px;border-radius:10px;border:2px solid var(--line)}
.fb.g{background:color-mix(in srgb,var(--leaf) 22%,var(--surface))}.fb.r{background:color-mix(in srgb,var(--rose) 18%,var(--surface))}
.stars{font-size:26px;letter-spacing:4px}
.sticky{position:sticky;bottom:0;background:var(--bg);padding:10px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:5}
.ok{color:var(--leaf);font-weight:700}.bad{color:var(--rose);font-weight:700}
</style></head><body><div class="wrap">
<header style="display:grid;gap:8px">
  <div class="tag" id="tag">บทที่ 4 ประเมินผล · ภารกิจเดี่ยว</div>

</header>

  <div class="msg err" id="lmsg" hidden></div>
</section>

</main>
</div>
<script>
"use strict";
const SHEET_URL="https://script.google.com/macros/s/AKfycbx6PC4sfC9m2FEYOionsVGpvt1dclejuPBhh8SOtYy5YIbsthC41O-lohVUwIMjYwGA6g/exec";
const $=id=>document.getElementById(id);

function shuf(arr,seed){const b=arr.slice();let s=0;for(const ch of String(seed))s=(s*31+ch.charCodeAt(0))%233280;s=s||7;
  for(let i=b.length-1;i>0;i--){s=(s*9301+49297)%233280;const j=s%(i+1);[b[i],b[j]]=[b[j],b[i]]}return b}
